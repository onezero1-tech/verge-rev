name: Build Linglong Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-linglong:
    runs-on: ubuntu-24.04
    container:
      # 使用 Deepin 25 官方镜像，与 UOS 25 兼容
      image: ghcr.io/linuxdeepin/deepin:25
      options: --user root

    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: "*"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Tauri artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build-tauri.yml
          name: linglong-project
          path: .
          workflow_conclusion: success
          if_no_artifact_found: fail

      - name: Verify downloaded files
        run: |
          echo "=== linglong-project contents ==="
          find linglong-project -type f | head -40
          file linglong-project/clash-verge

      - name: Install Linglong toolchain
        run: |
          # 使用 Deepin_25 的 APT 源
          echo "deb [trusted=yes] https://ci.deepin.com/repo/obs/linglong:/CI:/release/Deepin_25/ ./" | sudo tee /etc/apt/sources.list.d/linglong.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends linglong-builder linglong-box linglong-bin
          ll-builder --version
          ll-cli --version || true

      - name: Generate linglong.yaml
        run: |
          cat > linglong.yaml << 'YAML_EOF'
          version: '1'
          package:
            id: io.github.clash-verge-rev
            name: Clash Verge Rev
            version: 2.5.4.0
            kind: app
            description: |
              Clash Verge Rev - A Clash Meta GUI based on Tauri
            architecture: x86_64
          permissions:
            - network
            - local_socket
          command:
            - /opt/apps/io.github.clash-verge-rev/files/AppRun.sh
          base: org.deepin.base/25.2.2
          runtime: org.deepin.runtime.dtk/25.2.2
          build: |
            cp -r linglong-project/clash-verge $PREFIX/
            cp -r linglong-project/AppRun.sh $PREFIX/
            cp -r linglong-project/sidecar $PREFIX/ 2>/dev/null || true
            cp -r linglong-project/resources $PREFIX/ 2>/dev/null || true
            cp -r linglong-project/icons $PREFIX/ 2>/dev/null || true
            cp -r linglong-project/share $PREFIX/
            chmod +x $PREFIX/clash-verge
            chmod +x $PREFIX/AppRun.sh
            if [ -d "$PREFIX/sidecar" ]; then
              chmod +x $PREFIX/sidecar/* 2>/dev/null || true
            fi
          YAML_EOF
          echo "=== linglong.yaml ==="
          cat linglong.yaml

      - name: Build Linglong package
        uses: onezero1-tech/linglong-builder-action@main
        with:
          format: layer

      - name: Upload Linglong artifact
        uses: actions/upload-artifact@v4
        with:
          name: clash-verge-rev-linglong
          path: ./*.layer
          if-no-files-found: error
