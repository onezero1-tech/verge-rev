name: Build Linglong Package

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Tauri Artifacts"]
    types:
      - completed

jobs:
  build-linglong:
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: "*"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Tauri artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build-tauri.yml
          name: linglong-project
          path: linglong-project
          workflow_conclusion: success
          if_no_artifact_found: fail

      - name: Verify and prepare files
        shell: bash -e {0}      # 原来是 sh -e {0}
        run: |
          set -e
          echo "=== linglong-project 目录结构 ==="
          find linglong-project -type f | sort
          
          # 验证必要文件
          REQUIRED_FILES=(
            "linglong-project/clash-verge"
            "linglong-project/AppRun.sh"
            "linglong-project/clash-verge-service-install"
            "linglong-project/resources/Country.mmdb"
            "linglong-project/resources/geoip.dat"
            "linglong-project/resources/geosite.dat"
          )
          
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ 缺少必要文件: $file"
              exit 1
            else
              echo "✅ 找到文件: $file"
              chmod +x "$file" 2>/dev/null || true
            fi
          done
          
          # 验证 sidecar 目录
          if [ -d "linglong-project/sidecar" ]; then
            echo "✅ sidecar 目录存在"
            ls -la linglong-project/sidecar/
            chmod +x linglong-project/sidecar/* 2>/dev/null || true
          fi

      - name: Install ll-killer-go and Linglong Builder
        run: |
          # 安装基础依赖
          sudo apt-get update
          sudo apt-get install -y apt-file fuse-overlayfs erofs-utils wget

          # 添加玲珑官方软件源 (Ubuntu 24.04)
          echo "deb [trusted=yes] https://ci.deepin.com/repo/obs/linglong:/CI:/release/Ubuntu_24.04/ ./" | sudo tee /etc/apt/sources.list.d/linglong.list
          sudo apt-get update

          # 安装官方玲珑构建工具集 (包含 ll-builder)
          sudo apt-get install -y linglong-builder linglong-box linglong-bin

          # 安装 ll-killer-go
          wget https://github.com/System233/ll-killer-go/releases/latest/download/ll-killer-amd64 -O ll-killer
          chmod +x ll-killer
          sudo mv ll-killer /usr/local/bin/

      - name: Create build script
        run: |
          set -e
          
          cat > build.sh << 'EOF'
          #!/bin/bash
          set -e
          
          echo "=========================================="
          echo "Clash Verge Rev 玲珑包构建脚本"
          echo "=========================================="
          echo "PREFIX: ${PREFIX}"
          echo "TRIPLET: ${TRIPLET}"
          echo "KILLER_PACKER: ${KILLER_PACKER}"
          echo "=========================================="
          
          # 验证 PREFIX 环境变量
          if [ -z "$PREFIX" ]; then
            echo "❌ PREFIX 环境变量未设置"
            exit 1
          fi
          
          # 创建完整的目录结构
          echo "=== 创建目录结构 ==="
          mkdir -p $PREFIX/bin
          mkdir -p $PREFIX/lib/x86_64-linux-gnu
          mkdir -p $PREFIX/share/applications
          mkdir -p $PREFIX/share/icons/hicolor/128x128/apps
          mkdir -p $PREFIX/share/icons/hicolor/256x256/apps
          mkdir -p $PREFIX/share/icons/hicolor/scalable/apps
          mkdir -p $PREFIX/resources
          mkdir -p $PREFIX/sidecar
          mkdir -p $PREFIX/share/dbus-1/services
          
          # 复制主程序
          echo "=== 复制主程序 ==="
          if [ -f "linglong-project/clash-verge" ]; then
            install -m 755 linglong-project/clash-verge $PREFIX/bin/clash-verge
            install -m 755 linglong-project/clash-verge $PREFIX/clash-verge
            echo "✅ clash-verge 已安装"
          else
            echo "❌ clash-verge 不存在"
            exit 1
          fi
          
          # 复制启动脚本
          echo "=== 复制启动脚本 ==="
          if [ -f "linglong-project/AppRun.sh" ]; then
            install -m 755 linglong-project/AppRun.sh $PREFIX/AppRun.sh
            echo "✅ AppRun.sh 已安装"
          else
            echo "❌ AppRun.sh 不存在"
            exit 1
          fi
          
          # 复制服务安装脚本
          echo "=== 复制服务安装脚本 ==="
          if [ -f "linglong-project/clash-verge-service-install" ]; then
            install -m 755 linglong-project/clash-verge-service-install $PREFIX/clash-verge-service-install
            echo "✅ clash-verge-service-install 已安装"
          else
            echo "⚠️ clash-verge-service-install 不存在，跳过"
          fi
          
          # 复制资源文件
          echo "=== 复制资源文件 ==="
          if [ -d "linglong-project/resources" ]; then
            cp -rv linglong-project/resources/* $PREFIX/resources/
            echo "✅ 资源文件已复制:"
            find $PREFIX/resources -type f | while read f; do
              echo "  - $f ($(stat -c%s "$f") bytes)"
            done
          else
            echo "⚠️ resources 目录不存在"
          fi
          
          # 复制 sidecar
          echo "=== 复制 sidecar ==="
          if [ -d "linglong-project/sidecar" ]; then
            cp -rv linglong-project/sidecar/* $PREFIX/sidecar/
            chmod +x $PREFIX/sidecar/* 2>/dev/null || true
            echo "✅ Sidecar 文件已复制:"
            find $PREFIX/sidecar -type f
          else
            echo "⚠️ sidecar 目录不存在"
          fi
          
          # 复制图标
          echo "=== 复制图标 ==="
          if [ -d "linglong-project/icons" ]; then
            # 复制到标准图标目录
            if [ -d "linglong-project/icons/128x128" ]; then
              cp -rv linglong-project/icons/128x128/* $PREFIX/share/icons/hicolor/128x128/apps/ 2>/dev/null || true
            fi
            if [ -d "linglong-project/icons/256x256" ]; then
              cp -rv linglong-project/icons/256x256/* $PREFIX/share/icons/hicolor/256x256/apps/ 2>/dev/null || true
            fi
            if [ -d "linglong-project/icons/scalable" ]; then
              cp -rv linglong-project/icons/scalable/* $PREFIX/share/icons/hicolor/scalable/apps/ 2>/dev/null || true
            fi
            
            # 如果是单个图标文件
            if [ -f "linglong-project/icons/128x128.png" ]; then
              cp linglong-project/icons/128x128.png $PREFIX/share/icons/hicolor/128x128/apps/io.github.clash-verge-rev.png
            fi
            if [ -f "linglong-project/icons/icon.png" ]; then
              cp linglong-project/icons/icon.png $PREFIX/share/icons/hicolor/128x128/apps/io.github.clash-verge-rev.png
            fi
            
            echo "✅ 图标已复制"
            find $PREFIX/share/icons -type f
          fi
          
          # 复制 desktop 文件
          echo "=== 复制 desktop 文件 ==="
          if [ -d "linglong-project/share/applications" ]; then
            cp -rv linglong-project/share/applications/* $PREFIX/share/applications/
            echo "✅ Desktop 文件已复制"
          else
            # 创建默认的 desktop 文件
            cat > $PREFIX/share/applications/io.github.clash-verge-rev.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=Clash Verge Rev
          Comment=Clash Meta GUI
          Exec=/opt/apps/io.github.clash-verge-rev/files/AppRun.sh
          Icon=io.github.clash-verge-rev
          Type=Application
          Categories=Network;
          Terminal=false
          StartupNotify=true
          DESKTOP
            echo "✅ 默认 Desktop 文件已创建"
          fi
          
          # 复制其他 share 文件
          if [ -d "linglong-project/share" ]; then
            echo "=== 复制其他 share 文件 ==="
            # 避免重复复制 applications 和 icons
            find linglong-project/share -type f -not -path "*/applications/*" -not -path "*/icons/*" | while read f; do
              target_dir="$PREFIX/share/$(dirname "${f#linglong-project/share/}")"
              mkdir -p "$target_dir"
              cp -v "$f" "$target_dir/"
            done
          fi
          
          # 修复动态库路径
          echo "=== 修复动态库路径 ==="
          find $PREFIX -type f -name "*.so*" -exec patchelf --set-rpath '$ORIGIN:$ORIGIN/../lib:$ORIGIN/../lib/x86_64-linux-gnu:/runtime/lib' {} \; 2>/dev/null || true
          echo "✅ 动态库路径已修复"
          
          # 修复可执行文件权限
          echo "=== 修复文件权限 ==="
          chmod +x $PREFIX/bin/clash-verge 2>/dev/null || true
          chmod +x $PREFIX/clash-verge 2>/dev/null || true
          chmod +x $PREFIX/AppRun.sh 2>/dev/null || true
          chmod +x $PREFIX/clash-verge-service-install 2>/dev/null || true
          
          # 如果存在 sidecar 目录，设置权限
          if [ -d "$PREFIX/sidecar" ]; then
            find $PREFIX/sidecar -type f -exec chmod +x {} \; 2>/dev/null || true
          fi
          
          # 创建符号链接（如果需要）
          if [ ! -L "$PREFIX/clash-verge" ] && [ -f "$PREFIX/bin/clash-verge" ]; then
            ln -sf $PREFIX/bin/clash-verge $PREFIX/clash-verge 2>/dev/null || true
          fi
          
          # 验证构建结果
          echo "=== 构建结果验证 ==="
          echo "文件总数: $(find $PREFIX -type f | wc -l)"
          echo "目录总数: $(find $PREFIX -type d | wc -l)"
          echo "总大小: $(du -sh $PREFIX | cut -f1)"
          
          # 验证必要文件
          REQUIRED_FILES=(
            "$PREFIX/bin/clash-verge"
            "$PREFIX/AppRun.sh"
            "$PREFIX/share/applications/io.github.clash-verge-rev.desktop"
          ]
          
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ 缺少必要文件: $file"
              exit 1
            else
              echo "✅ $file"
            fi
          done
          
          # 验证资源文件
          RESOURCE_FILES=(
            "$PREFIX/resources/Country.mmdb"
            "$PREFIX/resources/geoip.dat"
            "$PREFIX/resources/geosite.dat"
          )
          
          for file in "${RESOURCE_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ 资源文件: $file ($(stat -c%s "$file") bytes)"
            else
              echo "⚠️ 可选资源文件缺失: $file"
            fi
          done
          
          echo ""
          echo "=== 构建完成，目录结构 ==="
          find $PREFIX -type f | sort | head -50
          echo ""
          echo "=========================================="
          echo "构建成功！"
          echo "=========================================="
          EOF
          
          chmod +x build.sh
          echo "✅ build.sh 创建完成"

      - name: Create linglong.yaml
        run: |
          set -e
          
          cat > linglong.yaml << 'YAML_EOF'
          version: '1'
          package:
            id: io.github.clash-verge-rev
            name: Clash Verge Rev
            version: 2.5.4.0
            kind: app
            description: |
              Clash Verge Rev - A Clash Meta GUI based on Tauri
            architecture: x86_64
          permissions:
            - network
            - local_socket
          command:
            - /opt/apps/io.github.clash-verge-rev/files/AppRun.sh
          base: org.deepin.base/25.2.2
          runtime: org.deepin.runtime.gtk4/25.2.2
          build: |
            ./build.sh
          YAML_EOF
          
          echo "=== linglong.yaml ==="
          cat linglong.yaml

      - name: Build with ll-killer layer build
        run: |
          set -e
          
          echo "=== 使用 ll-killer layer build 构建 ==="
          echo "构建命令: ll-killer layer build --no-post-setup -- ./build.sh"
          
          # 使用 ll-killer layer build 构建
          # --no-post-setup: 跳过后处理步骤
          # -- ./build.sh: 执行构建脚本
          ll-killer layer build --no-post-setup -- ./build.sh
          
          echo ""
          echo "=== 构建完成，检查输出 ==="
          
          # 检查生成的文件
          if ls *.layer 2>/dev/null; then
            echo "✅ 找到 layer 文件"
            ls -la *.layer
          else
            echo "❌ 未找到 layer 文件"
            echo "检查 linglong 目录..."
            ls -la linglong/ 2>/dev/null || true
            find . -name "*.layer" -o -name "*.uab" 2>/dev/null || true
            exit 1
          fi

      - name: Verify and list output files
        run: |
          set -e
          
          echo "=== 构建输出文件 ==="
          
          # 查找所有 layer 和 uab 文件
          LAYER_FILES=$(find . -name "*.layer" -not -path "./linglong/*" 2>/dev/null)
          UAB_FILES=$(find . -name "*.uab" -not -path "./linglong/*" 2>/dev/null)
          
          if [ -n "$LAYER_FILES" ]; then
            echo "✅ Layer 文件:"
            echo "$LAYER_FILES"
            echo ""
            echo "文件详情:"
            for f in $LAYER_FILES; do
              echo "  - $(basename $f): $(stat -c%s $f) bytes"
              file "$f"
            done
          else
            echo "⚠️ 未找到 layer 文件"
          fi
          
          if [ -n "$UAB_FILES" ]; then
            echo "✅ UAB 文件:"
            echo "$UAB_FILES"
            echo ""
            echo "文件详情:"
            for f in $UAB_FILES; do
              echo "  - $(basename $f): $(stat -c%s $f) bytes"
              file "$f"
            done
          else
            echo "⚠️ 未找到 UAB 文件"
          fi
          
          # 检查 linglong 目录
          if [ -d "linglong" ]; then
            echo ""
            echo "=== linglong 目录结构 ==="
            find linglong -type f | head -30
          fi
          
          # 如果没有找到任何输出文件，则报错
          if [ -z "$LAYER_FILES" ] && [ -z "$UAB_FILES" ]; then
            echo "❌ 未找到任何输出文件"
            echo "检查构建日志..."
            exit 1
          fi

      - name: Upload Linglong artifact
        uses: actions/upload-artifact@v4
        with:
          name: clash-verge-rev-linglong
          path: |
            *.layer
            *.uab
            linglong/output/**/*.layer
            linglong/output/**/*.uab
          if-no-files-found: warn
          retention-days: 30
