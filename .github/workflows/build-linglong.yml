name: Build Linglong Package

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Tauri Artifacts"]
    types:
      - completed

jobs:
  build-linglong:
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: "*"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Tauri artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build-tauri.yml
          name: linglong-project
          path: linglong-project
          workflow_conclusion: success
          if_no_artifact_found: fail

      - name: Verify downloaded files
        run: |
          echo "=== linglong-project contents ==="
          find linglong-project -type f | head -40
          ls -la linglong-project/clash-verge
          file linglong-project/clash-verge

      - name: Install ll-killer-go and Linglong Builder
        run: |
          # 安装基础依赖
          sudo apt-get update
          sudo apt-get install -y apt-file fuse-overlayfs erofs-utils wget

          # 添加玲珑官方软件源 (Ubuntu 24.04)
          echo "deb [trusted=yes] https://ci.deepin.com/repo/obs/linglong:/CI:/release/Ubuntu_24.04/ ./" | sudo tee /etc/apt/sources.list.d/linglong.list
          sudo apt-get update

          # 安装官方玲珑构建工具集 (包含 ll-builder)
          sudo apt-get install -y linglong-builder linglong-box linglong-bin

          # 安装 ll-killer-go
          wget https://github.com/System233/ll-killer-go/releases/latest/download/ll-killer-amd64 -O ll-killer
          chmod +x ll-killer
          sudo mv ll-killer /usr/local/bin/

      - name: Create build script
        run: |
          cat > build.sh << 'EOF'
          #!/bin/bash
          set -e
          
          # 创建必要的目录结构
          mkdir -p $PREFIX/bin
          mkdir -p $PREFIX/share/applications
          mkdir -p $PREFIX/share/icons/hicolor/128x128/apps
          
          # 复制主程序和相关文件
          cp -r linglong-project/clash-verge $PREFIX/
          cp -r linglong-project/AppRun.sh $PREFIX/
          cp -r linglong-project/sidecar $PREFIX/ 2>/dev/null || true
          cp -r linglong-project/resources $PREFIX/ 2>/dev/null || true
          cp -r linglong-project/icons $PREFIX/ 2>/dev/null || true
          cp -r linglong-project/share $PREFIX/
          
          # 设置执行权限
          chmod +x $PREFIX/clash-verge
          chmod +x $PREFIX/AppRun.sh
          if [ -d "$PREFIX/sidecar" ]; then
            chmod +x $PREFIX/sidecar/* 2>/dev/null || true
          fi
          
          # 修复路径引用
          find $PREFIX -type f -name "*.so*" -exec patchelf --set-rpath '$ORIGIN/../lib' {} \; 2>/dev/null || true
          
          echo "=== 构建完成 ==="
          ls -la $PREFIX/
          EOF
          chmod +x build.sh

      - name: Create linglong.yaml
        run: |
          cat > linglong.yaml << 'YAML_EOF'
          version: '1'
          package:
            id: io.github.clash-verge-rev
            name: Clash Verge Rev
            version: 2.5.4.0
            kind: app
            description: |
              Clash Verge Rev - A Clash Meta GUI based on Tauri
            architecture: x86_64
          permissions:
            - network
            - local_socket
          command:
            - /opt/apps/io.github.clash-verge-rev/files/AppRun.sh
          # 使用与社区测试源匹配的版本号
          base: org.deepin.base/25.2.2
          runtime: org.deepin.runtime.gtk4/25.2.2
          build: |
            ./build.sh
          YAML_EOF
          echo "=== linglong.yaml ==="
          cat linglong.yaml

      - name: Build Linglong package with ll-killer-go
        run: |
          # 使用 ll-killer-go 构建玲珑包
          # 这将创建一个 Debian 12 容器环境并在其中构建
          # 使用 layer build 直接生成 layer 文件，完全绕过 ll-builder
          ll-killer layer build  --no-post-setup -- ./build.sh

      - name: Verify Linglong package
        run: |
          echo "=== 生成的文件 ==="
          ls -la *.layer 2>/dev/null || echo "No layer files found"
          find . -name "*.layer" -o -name "*.uab" | head -20
          
          # 验证 layer 文件
          if ls *.layer 2>/dev/null; then
            echo "✅ 玲珑包构建成功"
          else
            echo "❌ 未找到 layer 文件"
            exit 1
          fi

      - name: Upload Linglong artifact
        uses: actions/upload-artifact@v4
        with:
          name: clash-verge-rev-linglong
          path: |
            *.layer
            *.uab
          if-no-files-found: warn
