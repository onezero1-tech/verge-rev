name: Build Linglong Package with ll-killer-go

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Tauri Artifacts"]
    types:
      - completed

jobs:
  build-linglong:
    runs-on: ubuntu-24.04
    container:
      image: debian:12
      options: --privileged --cap-add=SYS_ADMIN --security-opt seccomp=unconfined --device /dev/fuse
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: "*"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Tauri artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build-tauri.yml
          name: linglong-project
          path: linglong-project
          workflow_conclusion: success
          if_no_artifact_found: fail

      - name: Verify downloaded files
        run: |
          echo "=== linglong-project contents ==="
          find linglong-project -type f | head -40
          ls -la linglong-project/clash-verge

      # 安装构建所需的基础工具，并获取 ll-killer-go
      - name: Install build dependencies and ll-killer-go
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget git file gnupg apt-transport-https \
            fuse3 fuse-overlayfs erofs-utils

          # 下载 ll-killer-go (请根据最新版本调整 URL)
          # 最新版本可在 https://github.com/System233/ll-killer-go/releases 查看
          LL_KILLER_VERSION="v1.5.5"
          curl -L -o /usr/local/bin/ll-killer \
            "https://github.com/System233/ll-killer-go/releases/download/${LL_KILLER_VERSION}/ll-killer-amd64"
          chmod +x /usr/local/bin/ll-killer

          # 验证安装
          ll-killer -v



      # 生成应用启动脚本
      - name: Generate AppRun.sh
        run: |
          cat > linglong-project/AppRun.sh << 'APPRUN_EOF'
          #!/bin/bash
          APPDIR="/opt/apps/io.github.clash-verge-rev/files"
          LIBDIR="$APPDIR/lib/x86_64-linux-gnu"
          export LD_LIBRARY_PATH="$LIBDIR:$LD_LIBRARY_PATH"
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          exec "$LIBDIR/ld-linux-x86-64.so.2" --library-path "$LIBDIR" "$APPDIR/clash-verge" "$@"
          APPRUN_EOF
          chmod +x linglong-project/AppRun.sh

      # 生成 linglong.yaml，供 ll-killer 使用
      - name: Generate linglong.yaml
        run: |
          cat > linglong.yaml << 'YAML_EOF'
          version: '1'
          package:
            id: io.github.clash-verge-rev
            name: Clash Verge Rev
            version: 2.5.4.0
            kind: app
            description: |
              Clash Verge Rev - A Clash Meta GUI based on Tauri
            architecture: x86_64
          permissions:
            - network
            - local_socket
          command:
            - /opt/apps/io.github.clash-verge-rev/files/AppRun.sh
          base: org.deepin.base/25.2.2
          runtime: org.deepin.runtime.gtk4/25.2.2
          build: |
            # ll-killer 会执行此脚本进行构建
            mkdir -p $PREFIX/lib/x86_64-linux-gnu
            cp -r linglong-project/clash-verge $PREFIX/
            cp -r linglong-project/AppRun.sh $PREFIX/
            cp -r linglong-project/sidecar $PREFIX/ 2>/dev/null || true
            cp -r linglong-project/resources $PREFIX/ 2>/dev/null || true
            cp -r linglong-project/icons $PREFIX/ 2>/dev/null || true
            cp -r linglong-project/share $PREFIX/
            # 复制预下载的 glibc + libstdc++ 等依赖
            cp -a linglong-project/glibc-bundle/lib/x86_64-linux-gnu/. $PREFIX/lib/x86_64-linux-gnu/
            chmod +x $PREFIX/clash-verge $PREFIX/AppRun.sh
            if [ -d "$PREFIX/sidecar" ]; then chmod +x $PREFIX/sidecar/* 2>/dev/null || true; fi
          YAML_EOF
          echo "=== linglong.yaml generated ==="
          cat linglong.yaml

      # 使用 ll-killer 的 layer 子命令构建 layer 文件
      - name: Build Linglong layer with ll-killer
        run: |
          # ll-killer layer build 会读取当前目录的 linglong.yaml，执行 build 脚本，并生成 .layer 文件
          # --no-strip 保留调试符号，可根据需要调整
          ll-killer layer build --no-strip

          echo "=== Generated layer files ==="
          find . -name "*.layer" -o -name "*.uab" | head -20
          ls -la *.layer 2>/dev/null || echo "No layer files found"

      # 上传生成的 layer 文件
      - name: Upload Linglong artifact
        uses: actions/upload-artifact@v4
        with:
          name: clash-verge-rev-linglong
          path: |
            *.layer
            *.uab
          if-no-files-found: warn
