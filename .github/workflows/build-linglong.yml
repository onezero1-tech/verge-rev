name: Build Linglong Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-linglong:
    runs-on: ubuntu-24.04

    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: "*"
      # 强制玲珑工具链使用点对点 D-Bus，不依赖系统守护进程
      LL_NO_DBUS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Tauri artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build-tauri.yml
          name: linglong-project
          path: .
          workflow_conclusion: success
          if_no_artifact_found: fail

      - name: Verify downloaded files
        run: |
          echo "=== linglong-project contents ==="
          find linglong-project -type f | head -40
          file linglong-project/clash-verge

      - name: Install Linglong toolchain
        run: |
          echo "deb [trusted=yes] https://ppa.linyaps.org.cn/release/Ubuntu_24.04/ ./" | sudo tee /etc/apt/sources.list.d/linglong.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends linglong-builder linglong-box linglong-bin
          ll-builder --version
          ll-cli --version || true

      # 方案二：配置 D-Bus 策略并启动服务（兜底）
      - name: Configure D-Bus policy and start Linglong service
        run: |
          sudo tee /etc/dbus-1/system.d/org.deepin.linglong.PackageManager.conf << 'EOF'
          <!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
           "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
          <busconfig>
            <policy user="deepin-linglong">
              <allow own="org.deepin.linglong.PackageManager1"/>
            </policy>
            <policy context="default">
              <allow send_destination="org.deepin.linglong.PackageManager1"/>
            </policy>
          </busconfig>
          EOF
          sudo systemctl daemon-reload
          sudo systemctl restart dbus.service
          sleep 2
          sudo systemctl start org.deepin.linglong.PackageManager.service || true
          sleep 3
          systemctl is-active org.deepin.linglong.PackageManager.service || true
          busctl list --no-pager | grep -i linglong || true

      - name: Generate linglong.yaml
        run: |
          cat > linglong.yaml << 'YAML_EOF'
          version: '1'
          package:
            id: io.github.clash-verge-rev
            name: Clash Verge Rev
            version: 2.5.4.0
            kind: app
            description: |
              Clash Verge Rev - A Clash Meta GUI based on Tauri
            architecture: x86_64
          permissions:
            - network
            - local_socket
          command:
            - /opt/apps/io.github.clash-verge-rev/files/AppRun.sh
          base: org.deepin.base/25.2.2.8
          runtime: org.deepin.runtime.gtk4/25.2.2.0
          build: |
            cp -r linglong-project/clash-verge $PREFIX/
            cp -r linglong-project/AppRun.sh $PREFIX/
            cp -r linglong-project/sidecar $PREFIX/ 2>/dev/null || true
            cp -r linglong-project/resources $PREFIX/ 2>/dev/null || true
            cp -r linglong-project/icons $PREFIX/ 2>/dev/null || true
            cp -r linglong-project/share $PREFIX/
            chmod +x $PREFIX/clash-verge
            chmod +x $PREFIX/AppRun.sh
            if [ -d "$PREFIX/sidecar" ]; then
              chmod +x $PREFIX/sidecar/* 2>/dev/null || true
            fi
          YAML_EOF
          echo "=== linglong.yaml ==="
          cat linglong.yaml

      # 方案一：所有命令强制 --no-dbus
      - name: Query available base and runtime
        run: |
          ll-builder --no-dbus repo enable-mirror stable || true
          echo "=== Available base ==="
          ll-cli --no-dbus search --type=base org.deepin.base || true
          echo "=== Available runtime ==="
          ll-cli --no-dbus search --type=runtime org.deepin.runtime || true

      - name: Build Linglong package
        run: |
          # 同时使用 --no-dbus 和环境变量 LL_NO_DBUS=1 双重保险
          ll-builder --no-dbus build
          ll-builder --no-dbus export --layer
          ls -la *.layer

      - name: Upload Linglong artifact
        uses: actions/upload-artifact@v4
        with:
          name: clash-verge-rev-linglong
          path: ./*.layer
          if-no-files-found: error
