name: Build Linglong Package

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Tauri Artifacts"]
    types:
      - completed

jobs:
  build-linglong:
    # 使用 GitHub Actions 原生运行器，不使用容器，这是最可靠的方式
    runs-on: ubuntu-22.04
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: "*"
      # 设置 UTF-8 locale，避免 Qt 相关警告
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Tauri artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build-tauri.yml
          name: linglong-project
          path: linglong-project
          workflow_conclusion: success
          if_no_artifact_found: fail

      - name: Verify downloaded files
        run: |
          echo "=== linglong-project contents ==="
          find linglong-project -type f | head -40
          ls -la linglong-project/clash-verge

      - name: Install Linglong toolchain
        run: |
          # 1. 安装玲珑仓库源
          echo "deb [trusted=yes] https://ci.deepin.com/repo/obs/linglong:/CI:/release/Ubuntu_24.04/ ./" | sudo tee /etc/apt/sources.list.d/linglong.list
          sudo apt-get update
          # 2. 安装玲珑构建工具、沙箱容器和管理工具
          sudo apt-get install -y --no-install-recommends \
            linglong-builder \
            linglong-box \
            linglong-bin \
            curl \
            wget \
            git \
            file \
            fuse-overlayfs # 安装 Fuse-OverlayFS 作为后备方案
          # 3. 验证安装
          ll-builder --version
          ll-cli --version || true
          # 检查 Fuse-OverlayFS 是否可用
          fuse-overlayfs --version || true

      - name: Add community testing repo
        run: |
          # 正确语法：--alias 必须在位置参数之前
          ll-builder repo add --alias=testing stable https://cdn-linglong.odata.cc || true
          ll-builder repo update || true
          # 同时添加到 ll-cli 仓库，供查询和运行使用
          ll-cli repo add --alias=testing stable https://cdn-linglong.odata.cc || true
          echo "=== Repo list ==="
          ll-builder repo show testing 2>/dev/null || true
          # 验证网络连接
          echo "Testing network connectivity..."
          timeout 10 curl -sI https://cdn-linglong.odata.cc && echo "✅ 网络连接正常" || echo "⚠️ 无法访问社区测试源"

      - name: Query available runtime
        run: |
          echo "=== 查询所有可用的 Runtime ==="
          ll-cli search org.deepin.runtime.gtk4  --type=runtime --show-all-version || true
          echo "=== 查询 Base Runtime ==="
          ll-cli search org.deepin.base --type=runtime --show-all-version || true
          echo "=== 查询指定仓库的 GTK4 Runtime ==="
          ll-cli search org.deepin.runtime.gtk4 --type=runtime --show-all-version --repo=testing || true

      - name: Generate linglong.yaml
        run: |
          cat > linglong.yaml << 'YAML_EOF'
          version: '1'
          package:
            id: io.github.clash-verge-rev
            name: Clash Verge Rev
            version: 2.5.4.0
            kind: app
            description: |
              Clash Verge Rev - A Clash Meta GUI based on Tauri
            architecture: x86_64
          permissions:
            - network
            - local_socket
          command:
            - /opt/apps/io.github.clash-verge-rev/files/AppRun.sh
          # 使用与社区测试源匹配的版本号（3位数字）
          base: org.deepin.base/25.2.2
          runtime: org.deepin.runtime.gtk4/25.2.2
          build: |
            # 构建脚本：复制文件到玲珑容器标准路径
            mkdir -p $PREFIX/bin
            mkdir -p $PREFIX/share/applications
            mkdir -p $PREFIX/share/icons/hicolor/128x128/apps
            
            # 复制主程序和相关文件
            cp -r linglong-project/clash-verge $PREFIX/
            cp -r linglong-project/AppRun.sh $PREFIX/
            cp -r linglong-project/sidecar $PREFIX/ 2>/dev/null || true
            cp -r linglong-project/resources $PREFIX/ 2>/dev/null || true
            cp -r linglong-project/icons $PREFIX/ 2>/dev/null || true
            cp -r linglong-project/share $PREFIX/
            
            # 设置执行权限
            chmod +x $PREFIX/clash-verge
            chmod +x $PREFIX/AppRun.sh
            if [ -d "$PREFIX/sidecar" ]; then
              chmod +x $PREFIX/sidecar/* 2>/dev/null || true
            fi
          YAML_EOF
          echo "=== linglong.yaml ==="
          cat linglong.yaml

      - name: Build Linglong package
        run: |
          # 尝试使用内核级 OverlayFS，如果失败则切换到 Fuse-OverlayFS
          echo "尝试使用内核 OverlayFS..."
          if ! ll-builder build --skip-fetch-source; then
            echo "⚠️ 内核 OverlayFS 失败，尝试使用 Fuse-OverlayFS..."
            # 设置环境变量，强制使用 Fuse-OverlayFS
            export LINGLONG_OVERLAYFS_BACKEND=fuse-overlayfs
            # 再次尝试构建
            ll-builder build --skip-fetch-source
          fi

      - name: Export Linglong package
        run: |
          # 导出为 layer 格式
          ll-builder export --layer --no-develop || true
          # 查看生成的文件
          echo "=== 生成的文件 ==="
          ls -la *.layer 2>/dev/null || echo "No layer files found"
          find . -name "*.layer" -o -name "*.uab" | head -20

      - name: Upload Linglong artifact
        uses: actions/upload-artifact@v4
        with:
          name: clash-verge-rev-linglong
          path: |
            *.layer
            *.uab
          if-no-files-found: warn
