name: Build clash-verge-rev Linglong Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-linglong:
    runs-on: ubuntu-24.04
    container:
      # 使用一个包含玲珑构建工具的基础镜像
      image: ghcr.io/linyaps/linglong-builder:latest
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            pkg-config \
            build-essential \
            curl wget git unzip file binutils

      - name: Install Node.js and pnpm
        run: |
          # 安装 Node.js 和 pnpm 的步骤...
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs
          corepack enable
          corepack prepare pnpm@9.13.2 --activate

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:$PATH"

      - name: Install Tauri CLI
        run: |
          cargo install tauri-cli --version "^2" --locked

      - name: Prepare sidecars and resources
        run: |
          # 下载 mihomo 和 clash-verge-service 等 sidecar 文件
          # 使用之前讨论过的 prebuild 脚本
          pnpm install
          node scripts/prebuild.mjs x86_64-unknown-linux-gnu

      - name: Build Tauri AppImage
        run: |
          cargo tauri build --bundles appimage --no-sign

      - name: Convert AppImage to Linglong
        run: |
          # 使用 ll-appimage-convert 工具进行转换
          # 假设 AppImage 文件位于 target/release/bundle/appimage/
          APPIMAGE=$(find target/release/bundle/appimage -name "*.AppImage" -type f | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "ERROR: No AppImage found"
            exit 1
          fi
          
          ll-appimage-convert convert \
            --file "$APPIMAGE" \
            --name "io.github.clash-verge-rev" \
            --id "io.github.clash-verge-rev" \
            --version "2.5.4" \
            --description "Clash Verge Rev for UOS" \
            -b
          # -b 选项表示转换后立即构建，生成 .layer 或 .uab 文件

      - name: Upload Linglong artifact
        uses: actions/upload-artifact@v4
        with:
          name: clash-verge-rev-linglong
          path: |
            **/*.layer
            **/*.uab
          if-no-files-found: error
