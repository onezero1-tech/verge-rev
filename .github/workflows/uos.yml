name: Build clash-verge-rev Linglong Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-linglong:
    runs-on: ubuntu-24.04  # 或 ubuntu-22.04，但24.04是玲珑官方明确支持的

    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: "*"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev \
            pkg-config \
            build-essential \
            curl wget git unzip file binutils

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.13.2 --activate
          pnpm --version

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show active-toolchain

      - name: Install Tauri CLI
        run: |
          cargo install tauri-cli --version "^2" --locked

      - name: Install frontend dependencies
        run: |
          pnpm install

      - name: Download sidecars and resources (prebuild)
        run: |
          set -e
          node scripts/prebuild.mjs x86_64-unknown-linux-gnu
          echo "=== src-tauri/sidecar/ ==="
          ls -la src-tauri/sidecar/
          echo "=== src-tauri/resources/ ==="
          ls -la src-tauri/resources/ 2>/dev/null || true

      - name: Build Tauri application (no bundle)
        run: |
          cargo tauri build --no-bundle --verbose
          echo "=== Build output ==="
          ls -la target/release/
          file target/release/clash-verge

      - name: Prepare Linglong project
        run: |
          set -e
          mkdir -p linglong-project

          # 1. 复制 Tauri 编译产物
          cp target/release/clash-verge linglong-project/clash-verge
          chmod +x linglong-project/clash-verge

          # 2. 复制 sidecar 和资源文件
          cp -r src-tauri/sidecar linglong-project/sidecar 2>/dev/null || true
          cp -r src-tauri/resources linglong-project/resources 2>/dev/null || true

          # 3. 复制图标
          if [ -d "src-tauri/icons" ]; then
            cp -r src-tauri/icons linglong-project/icons
          fi

          # 4. 生成 AppRun.sh 启动脚本
          cat > linglong-project/AppRun.sh << 'EOF'
          #!/bin/bash
          # 禁用 WebKitGTK 合成和沙箱，以兼容旧系统
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1

          DIR="$(cd "$(dirname "$0")" && pwd)"
          # 将 sidecar 目录加入 PATH，供主程序查找内核和服务
          export PATH="$DIR/sidecar:$PATH"

          exec "$DIR/clash-verge" "$@"
          EOF
          chmod +x linglong-project/AppRun.sh

          # 5. 准备 desktop 文件和图标目录
          mkdir -p linglong-project/share/applications
          mkdir -p linglong-project/share/icons/hicolor/256x256/apps

          cat > linglong-project/share/applications/io.github.clash-verge-rev.desktop << 'EOF'
          [Desktop Entry]
          Name=Clash Verge Rev
          Comment=Clash Meta GUI
          Exec=/opt/apps/io.github.clash-verge-rev/files/AppRun.sh
          Icon=io.github.clash-verge-rev
          Type=Application
          Categories=Network;
          Terminal=false
          EOF

          # 6. 复制图标文件（如果存在）
          if [ -f linglong-project/icons/128x128.png ]; then
            cp linglong-project/icons/128x128.png linglong-project/share/icons/hicolor/256x256/apps/io.github.clash-verge-rev.png
          elif [ -f linglong-project/icons/icon.png ]; then
            cp linglong-project/icons/icon.png linglong-project/share/icons/hicolor/256x256/apps/io.github.clash-verge-rev.png
          fi

          echo "=== linglong-project contents ==="
          find linglong-project -type f | head -40

      - name: Generate linglong.yaml
        run: |
          cat > linglong-project/linglong.yaml << 'YAML_EOF'
          version: '1'

          package:
            id: io.github.clash-verge-rev
            name: Clash Verge Rev
            version: 2.5.4.0
            kind: app
            description: |
              Clash Verge Rev - A Clash Meta GUI based on Tauri
            architecture: x86_64  # 明确使用x86_64，玲珑标准架构名

          command:
            - /opt/apps/io.github.clash-verge-rev/files/AppRun.sh

          # 关键：根据玲珑文档，基础环境选择deepin base，运行时选择GTK4环境
          base: org.deepin.base/25.2.2.8
          runtime: org.deepin.runtime.gtk4/25.2.2.0  # 如果此runtime不存在，可尝试org.deepin.runtime/23.0.1

          # 应用构建规则（此处我们只是复制文件，无需复杂编译）
          build: |
            # 将准备阶段的所有文件复制到玲珑容器的安装前缀
            cp -r clash-verge $PREFIX/
            cp -r AppRun.sh $PREFIX/
            cp -r sidecar $PREFIX/ 2>/dev/null || true
            cp -r resources $PREFIX/ 2>/dev/null || true
            cp -r icons $PREFIX/ 2>/dev/null || true
            cp -r share $PREFIX/

            # 确保可执行权限
            chmod +x $PREFIX/clash-verge
            chmod +x $PREFIX/AppRun.sh
          YAML_EOF

          echo "=== linglong.yaml ==="
          cat linglong-project/linglong.yaml

      - name: Install Linglong toolchain
        run: |
          # 添加玲珑官方仓库源（针对Ubuntu 24.04）
          echo "deb [trusted=yes] https://ci.deepin.com/repo/obs/linglong:/CI:/release/Ubuntu_24.04/ ./" | sudo tee /etc/apt/sources.list.d/linglong.list
          sudo apt-get update
          sudo apt-get install -y linglong-builder linglong-box linglong-bin

      - name: Build Linglong package
        run: |
          cd linglong-project
          # 构建玲珑应用
          ll-builder build --verbose
          # 导出layer文件（这是玲珑应用的标准分发格式）
          ll-builder export --layer --verbose
          # 如果要导出UAB格式（更先进的离线包格式），可以运行：
          # ll-builder export --uab --verbose

      - name: Upload Linglong artifact
        uses: actions/upload-artifact@v4
        with:
          name: clash-verge-rev-linglong
          path: |
            linglong-project/*.layer
            linglong-project/*.uab
          if-no-files-found: error
